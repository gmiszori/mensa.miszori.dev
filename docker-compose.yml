# Production setup: Caddy (HTTPS) in front of Mensaplan Zürich, on one server.
#
#   cp .env.example .env      # then set DOMAIN to your domain
#   docker compose up --build -d
#
# The domain's DNS record must point to this server, and ports 80 and 443 must be open, so
# Caddy can get the certificate. Those ports belong to the shared proxy from
# github.com/gmiszori/webserver-proxy, which must be running first: it creates the "webserver"
# network Caddy joins. Menus and photos are kept in the "data" volume, certificates in
# "caddy_data", so restarts and updates keep both.
#
# Both containers run as unprivileged users on a read-only filesystem, without Linux
# capabilities (Caddy keeps only the one to listen on ports 80 and 443), and can't gain
# privileges. Memory, process and open-file limits keep either of them from starving the other
# sites on the server. Caddy runs as user 10003, so its volumes must belong to that user, once:
#
#   docker compose run --rm --no-deps --user root --cap-add CHOWN --cap-add DAC_READ_SEARCH --entrypoint chown caddy -R 10003:10003 /data /config
services:
  mensaplan:
    build: .
    environment:
      DOMAIN: ${DOMAIN:-localhost} # for absolute links in link previews
      GOMEMLIMIT: 1800MiB # free memory sooner when large photos near mem_limit
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 2g # resizing photos (72 megapixels at a time) needs the most; normal use is far below
    pids_limit: 100
    ulimits: &ulimits
      core: 0 # a crash leaves no copy of its memory on disk
      nofile: { soft: 2048, hard: 2048 }
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" } # keep logs from filling the disk
    healthcheck:
      test: ["CMD", "/mensaplan", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  caddy:
    # Pinned by digest, so an update is a deliberate change here. To update, change the tag
    # and digest (docker buildx imagetools inspect caddy:<version>-alpine).
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    user: "10003:10003"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # to listen on 80 and 443
    security_opt: [no-new-privileges:true]
    # Not published on the host: the shared proxy routes this domain here by name.
    networks:
      default:
      webserver:
        aliases: [mensa]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ORIGIN_PULL: ${ORIGIN_PULL:-off} # see Caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./origin-pull-ca.pem:/etc/caddy/origin-pull-ca.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mensaplan:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 100
    ulimits: *ulimits
    logging: *logging

volumes:
  data:
  caddy_data:
  caddy_config:

networks:
  webserver:
    external: true
