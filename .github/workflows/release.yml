name: Release

# Pushing a tag such as v1.0.0 creates the GitHub Release for it. Its notes list the commits
# since the previous tag (GitHub's own generated notes only list pull requests, and most changes
# are pushed to main directly).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to find the previous tag
      # The VERSION file is what the running site reports, so it must match the tag.
      - run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || (echo "VERSION is $(cat VERSION), tag is $GITHUB_REF_NAME" && exit 1)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          git log --no-merges --pretty='- %s' "$range" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
